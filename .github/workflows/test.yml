name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: pre-commit and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      # The hooks a commit runs locally, at the versions .pre-commit-config.yaml
      # pins — ruff included, so there is no second ruff version to drift, and
      # Renovate's hook updates are checked before they are merged.
      - run: pre-commit run --all-files --show-diff-on-failure
      # Only the Home-Assistant-free modules; see pyproject.toml.
      - run: mypy

  python:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest

  tests-ha:
    name: pytest (with Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test_ha.txt
      - run: pytest -p no:cacheprovider -c pytest_ha.ini
