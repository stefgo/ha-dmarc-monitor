[tool.ruff]
# Home Assistant's own setting — staying with it keeps copied snippets and
# upstream examples from being reformatted on arrival.
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # The docstrings deliberately explain the "why" in prose; line breaks in
    # them are a readability decision, not a style violation.
    "E501",
    # Prose uses en dashes for ranges ("10–50") and asides. They are meant.
    "RUF002",
    "RUF001",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
# Only the Home-Assistant-free modules; the rest imports homeassistant, which
# ships no stubs of its own.
files = [
    "custom_components/dmarc_monitor/const.py",
    "custom_components/dmarc_monitor/models.py",
    "custom_components/dmarc_monitor/parse.py",
    "custom_components/dmarc_monitor/analysis.py",
    "custom_components/dmarc_monitor/tracker.py",
    "custom_components/dmarc_monitor/messages.py",
]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "voluptuous.*", "aiohttp.*"]
ignore_missing_imports = true
